apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waterstop-ingress
  namespace: waterstop-static
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: |
      kube-system-infra-rate-limit@kubernetescrd,
      kube-system-infra-security-headers@kubernetescrd
  labels:
    app.kubernetes.io/name: waterstop-static
    app.kubernetes.io/part-of: waterstop
    app.kubernetes.io/managed-by: flux
spec:
  ingressClassName: traefik
  rules:
    - host: waterstop.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: waterstop-static
                port:
                  number: 80
